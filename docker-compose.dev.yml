version: "3.8"

services:
  # Override auth-api for development with hot reload
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth_api_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/tmp # Exclude air tmp directory
      - go_modules:/go/pkg/mod # Cache Go modules
    working_dir: /app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - REDIS_NOTIFY_KEYSPACE_EVENTS=Ex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - shared-api-network

  # Mailpit — local SMTP catch-all + web UI for email testing.
  # SMTP:   localhost:1025  (host) / mailpit:1025  (inside Docker)
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped
    networks:
      - default
      - shared-api-network

volumes:
  go_modules:

networks:
  shared-api-network:
    external: true
