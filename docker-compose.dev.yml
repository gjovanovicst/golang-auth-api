name: auth-dev

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - shared-api-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --notify-keyspace-events Ex
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - shared-api-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 16M

  # Redis Commander - Web UI for Redis Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Mailpit — local SMTP catch-all + web UI for email testing.
  # SMTP:   localhost:1025  (host) / mailpit:1025  (inside Docker)
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped
    networks:
      - default
      - shared-api-network
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # Go Auth API — Development with Air hot reload
  # Image is built explicitly by dev.sh via: podman build -f Dockerfile.dev
  auth-api:
    image: localhost/auth-dev_auth-api:latest
    container_name: auth_api_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/tmp # exclude Air's tmp directory from the host mount
      - go_modules:/go/pkg/mod # cache Go modules across rebuilds
    working_dir: /app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - REDIS_NOTIFY_KEYSPACE_EVENTS=Ex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - shared-api-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.05"
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  go_modules:

networks:
  default: {}
  shared-api-network:
    external: true
